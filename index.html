<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allenamenti">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="fonts/poppins-latin-900-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/poppins-latin-800-italic.woff2" as="font" type="font/woff2" crossorigin>
<title>Allenamenti</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#000;--sec:#6e6e73;--ter:#aeaeb2;--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--teal:#30b0c7;--purple:#af52de;--indigo:#5856d6;
  --bar:rgba(249,249,249,.86);--shadow:0 1px 0 rgba(0,0,0,.02);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000;--card:#1c1c1e;--text:#fff;--sec:#98989f;--ter:#636366;--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--teal:#40c8e0;--purple:#bf5af2;--indigo:#5e5ce6;
  --bar:rgba(22,22,23,.86);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
/* nav */
#nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent}
#nav.line{border-bottom-color:var(--sep)}
.navrow{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.navtitle{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.navbtn{color:var(--blue);font-size:17px;padding:8px;display:flex;align-items:center;gap:2px}
.navbtn.r{justify-self:end;font-weight:600}
.navbtn svg{width:12px;height:20px}
main{padding:0 16px;max-width:640px;margin:0 auto}
h1.large{font-size:34px;font-weight:700;letter-spacing:.3px;margin:4px 0 12px}
.sec-h{font-size:13px;color:var(--sec);text-transform:uppercase;margin:24px 16px 7px;letter-spacing:-.08px}
.sec-h.big{text-transform:none;font-size:22px;font-weight:700;color:var(--text);margin:26px 0 10px}
.sec-f{font-size:13px;color:var(--sec);margin:7px 16px 0}
/* lists */
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row.ic+.row.ic::before{left:62px}
.row:active.tap{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px}
.row .s{font-size:14px;color:var(--sec);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--sec);font-size:17px;white-space:nowrap}
.chev{width:8px;height:14px;color:var(--ter);flex:none}
.icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--fill);color:var(--sec);white-space:nowrap}
.pill.blue{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.pill.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.orange{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
/* cards */
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--sec);font-weight:500}
.tile .n{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.tile .n small{font-size:15px;font-weight:600;color:var(--sec);margin-left:2px}
.tile .d{font-size:13px;margin-top:2px;color:var(--sec)}
.up{color:var(--green)}.down{color:var(--red)}
.hero{background:var(--card);border-radius:14px;padding:16px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:flex-end}
.hero .lab{font-size:13px;color:var(--sec);font-weight:500;text-transform:uppercase}
.hero .time{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.05}
.hero .sub{font-size:14px;color:var(--sec);text-align:right}
.hero .sub b{color:var(--text);font-size:20px;display:block;font-weight:600}
.active-card{background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;border-radius:16px;padding:16px;margin-bottom:6px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.active-card .t{font-weight:600}.active-card .s{opacity:.85;font-size:14px}
.active-card .time{font-size:28px;font-variant-numeric:tabular-nums;font-weight:500;margin-left:auto}
/* exercise card */
.ex .name{font-size:19px;font-weight:600;letter-spacing:-.2px}
.ex .grp{font-size:13px;color:var(--sec);margin-top:2px}
.ex .last{font-size:14px;color:var(--sec);margin-top:8px}
.ex .last b{color:var(--text);font-weight:500}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:10px;margin-top:10px;line-height:1.3}
.hint.up,.hint.up2{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--text)}
.hint.keep{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.hint.down{background:color-mix(in srgb,var(--orange) 15%,transparent)}
.hint.new{background:var(--fill)}
.hint i{font-style:normal}
.sets{margin-top:10px}
.set{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.set .no{width:22px;height:22px;border-radius:11px;background:var(--fill);font-size:13px;font-weight:600;display:grid;place-items:center;color:var(--sec)}
.set .val{flex:1;font-size:17px}
.set .x{color:var(--ter);padding:4px 6px;font-size:15px}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px}
.badge.ok{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.badge.hi{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.badge.lo{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.badge.pr{color:#b8860b;background:rgba(255,204,0,.2)}
.entry{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.stepper{flex:1;display:flex;align-items:center;background:var(--fill);border-radius:10px;height:46px;min-width:0}
.stepper button{width:38px;height:46px;font-size:22px;color:var(--blue);flex:none}
.stepper input{flex:1;min-width:0;width:100%;border:0;background:none;text-align:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;padding:0}
.stepper .u{font-size:12px;color:var(--sec);margin-right:2px;position:relative;left:-4px;display:none}
.addset{width:56px;border-radius:10px;background:var(--blue);color:#fff;font-size:26px;font-weight:400;flex:none}
.addset:active{opacity:.7}
.unitlab{display:flex;gap:8px;margin-top:4px;font-size:12px;color:var(--sec)}
.unitlab span{flex:1;text-align:center}.unitlab i{width:56px}
/* buttons */
.btn{display:block;width:100%;height:50px;border-radius:12px;font-size:17px;font-weight:600;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.plain{background:var(--card);color:var(--blue)}
.btn.danger{background:var(--card);color:var(--red);font-weight:400}
.btn:active{opacity:.7}
/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme: dark){.seg button.on{background:#636366}}
/* form */
.frow{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:48px;position:relative}
.frow+.frow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.frow label{flex:1}
.frow input[type=date],.frow select,.frow .num{background:var(--fill);border:0;border-radius:8px;padding:6px 10px;font-size:17px;text-align:right;max-width:55%}
.frow .num{width:76px;text-align:center}
.frow .seg{width:170px}
textarea{width:100%;border:0;background:none;resize:none;min-height:70px;outline:none;padding:12px 16px;font-size:17px}
.calc{display:flex;justify-content:space-around;text-align:center;padding:14px 4px}
.calc .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.calc .k{font-size:12px;color:var(--sec)}
.empty{color:var(--sec);text-align:center;padding:22px 16px;font-size:15px}
/* week dots */
.dots{display:flex;gap:6px;margin-top:8px}
.dots span{flex:1;height:6px;border-radius:3px;background:var(--fill)}
.dots span.on{background:var(--green)}
/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--sec);font-family:inherit}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bar);border-top:.5px solid var(--sep);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--ter);font-size:10px;font-weight:500}
#tabs button.on{color:var(--blue)}
#tabs svg{width:26px;height:26px}
/* rest bar */
#rest{position:fixed;left:8px;right:8px;z-index:29;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--card);border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);padding:10px 12px;display:flex;align-items:center;gap:12px;overflow:hidden;max-width:624px;margin:0 auto}
#rest.hidden{display:none}
#rest .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--orange);transition:width .25s linear}
#rest.done .prog{background:var(--green);width:100%!important}
#rest .rl{font-size:12px;color:var(--sec);font-weight:600;text-transform:uppercase}
#rest .rt{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--orange);line-height:1.1}
#rest.done .rt{color:var(--green)}
#rest .grow{flex:1}
#rest button{background:var(--fill);border-radius:16px;height:34px;padding:0 12px;font-size:15px;font-weight:600;color:var(--blue)}
#rest.done{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.03)}}
/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 54px);transform:translate(-50%,-20px);opacity:0;z-index:50;background:rgba(30,30,30,.92);color:#fff;
  padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;transition:all .3s;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.done-hero{text-align:center;padding:16px 0 8px}
.done-hero .e{font-size:54px}
.done-hero h2{margin:6px 0 2px;font-size:26px}
.done-hero p{margin:0;color:var(--sec)}
.note{font-size:14px;color:var(--sec);line-height:1.45}
.note ol{padding-left:20px;margin:6px 0}

/* --- v1.1 ritocchi --- */
.card,.list,.tile,.hero{box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.045)}
@media (prefers-color-scheme: dark){.card,.list,.tile,.hero{box-shadow:none}}
.btn,.row.tap,.active-card,.addset,.stepper button,#rest button{transition:transform .12s ease,opacity .12s}
.btn:active,.active-card:active,.addset:active{transform:scale(.97)}
.stepper button:active{transform:scale(.85)}
.kicker{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.2px;margin-top:8px}
h1.large{margin-top:0}
#toast{top:auto;bottom:calc(74px + env(safe-area-inset-bottom));transform:translate(-50%,20px);border-radius:22px;padding:12px 18px;
  background:rgba(28,28,30,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
body.resting #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.hero.grad{background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff}
.hero.grad .lab,.hero.grad .sub{color:rgba(255,255,255,.8)}.hero.grad .sub b{color:#fff}
.hero .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden;width:140px;margin-left:auto}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:3px}
.ex .head{display:flex;align-items:center;gap:12px}
.ex .gi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.ex .head .grow{flex:1;min-width:0}
.ex .cnt{font-size:13px;font-weight:600;color:var(--sec);background:var(--fill);border-radius:10px;padding:3px 9px}
.ex.done .cnt{color:#fff;background:var(--green)}
.tile .k{display:flex;align-items:center;gap:6px}
.tile .k i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
.row .icon{border-radius:10px;width:36px;height:36px}
.sec-h{font-weight:500}

/* --- v1.2 restyling --- */
:root{--round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --g-blue:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 100%);--g-green:linear-gradient(135deg,#30d158 0%,#00b386 100%);
  --g-d1:linear-gradient(135deg,#0a84ff 0%,#32c3e6 100%);--g-d2:linear-gradient(135deg,#ff9f0a 0%,#ff375f 100%);--g-d3:linear-gradient(135deg,#bf5af2 0%,#5e5ce6 100%);
  --r-card:20px;--r-ctl:14px;--ease:cubic-bezier(.2,.8,.2,1)}
main{padding:0 20px}
h1.large,.tile .n,.hero .time,#rest .rt,.calc .n,.done-hero h2,.daycard .dt,.active-card .time,.hero .sub b{font-family:var(--round)}
h1.large{font-size:36px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.kicker{font-size:13px;letter-spacing:.4px;color:var(--sec);margin-top:10px}
.sec-h{margin:30px 4px 10px;font-size:13px;font-weight:600;letter-spacing:.3px}
.sec-f{margin:8px 4px 0}
.card{border-radius:var(--r-card);padding:18px}
.list{border-radius:var(--r-card)}
.tile{border-radius:var(--r-card);padding:16px}
.tiles{gap:12px}
.tile .n{font-size:30px;font-weight:800;letter-spacing:-.6px}
.row{padding:13px 18px;min-height:52px}
.row+.row::before{left:18px}
/* day cards */
.days{display:grid;gap:12px}
.daycard{position:relative;overflow:hidden;border-radius:22px;padding:18px 20px;min-height:104px;color:#fff;text-align:left;display:block;width:100%;
  box-shadow:0 8px 24px -10px rgba(0,0,0,.35);transition:transform .2s var(--ease)}
.daycard:active{transform:scale(.97)}
.daycard.d1{background:var(--g-d1)}.daycard.d2{background:var(--g-d2)}.daycard.d3{background:var(--g-d3)}
.daycard .dn{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.85}
.daycard .dt{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.daycard .ds{font-size:14px;opacity:.9;margin-top:6px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daycard .big{position:absolute;right:14px;bottom:-26px;font:900 120px/1 var(--round);opacity:.16;pointer-events:none}
.daycard .nx{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px}
.active-card{border-radius:22px;padding:18px 20px;background:var(--g-green);box-shadow:0 10px 26px -10px rgba(48,209,88,.6);margin-top:4px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 14px 34px -8px rgba(48,209,88,.75)}}
/* buttons */
.btn{height:54px;border-radius:27px;font-size:17px;font-weight:700;letter-spacing:-.2px;transition:transform .18s var(--ease),opacity .18s}
.btn.primary{background:var(--g-blue);box-shadow:0 8px 20px -8px rgba(10,132,255,.7)}
.btn.green{background:var(--g-green);box-shadow:0 8px 20px -8px rgba(48,209,88,.7)}
.btn.plain{color:var(--blue)}
.btn.danger{background:transparent;height:46px}
.btn:active{transform:scale(.96)}
.navbtn{font-weight:500}.navbtn.r{font-weight:700}
/* exercise card */
.ex .name{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.ex .gi{border-radius:13px;width:42px;height:42px;font-family:var(--round);font-size:15px}
.hint{border-radius:14px;padding:10px 12px;margin-top:12px}
.set{padding:9px 0}
.set .no{width:26px;height:26px;border-radius:13px;font-family:var(--round)}
.set .val{font-family:var(--round);font-weight:600}
.set.pop{animation:popIn .45s var(--ease)}
@keyframes popIn{0%{opacity:0;transform:translateY(-6px) scale(.96);background:color-mix(in srgb,var(--blue) 12%,transparent)}60%{opacity:1}100%{transform:none;background:transparent}}
.entry{gap:10px;margin-top:14px}
.stepper{border-radius:var(--r-ctl);height:52px;padding:0 6px;background:var(--fill)}
.stepper button{width:34px;height:34px;border-radius:17px;background:var(--card);font-size:20px;font-weight:600;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:transform .12s}
.stepper button:active{transform:scale(.85)}
.stepper input{font-family:var(--round);font-size:21px;font-weight:700}
.addset{width:60px;border-radius:var(--r-ctl);background:var(--g-blue);box-shadow:0 6px 16px -6px rgba(10,132,255,.7);display:grid;place-items:center}
.addset svg{width:26px;height:26px}
.addset:active{transform:scale(.9);opacity:1}
.unitlab{margin-top:6px;font-weight:500}.unitlab i{width:60px}
/* hero */
.hero{border-radius:22px;padding:20px;margin-top:6px}
.hero.grad{background:var(--g-blue);box-shadow:0 12px 28px -12px rgba(10,132,255,.7)}
.hero .time{font-size:50px;font-weight:700;letter-spacing:-1.5px}
.hero .bar i{transition:width .6s var(--ease)}
/* segmented */
.seg{border-radius:11px;padding:3px}.seg button{border-radius:9px;height:32px;transition:background .2s,box-shadow .2s}
/* rest bar with ring */
#rest{border-radius:24px;padding:12px 14px;bottom:calc(64px + env(safe-area-inset-bottom));left:12px;right:12px;
  background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 12px 36px rgba(0,0,0,.2);animation:slideUp .4s var(--ease)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
#rest .prog{display:none}
#rest .ring{width:50px;height:50px;flex:none;transform:rotate(-90deg)}
#rest .ring circle{fill:none;stroke-width:5}
#rest .ring .trk{stroke:var(--fill)}
#rest .ring .prg{stroke:var(--orange);stroke-linecap:round;stroke-dasharray:119.4;transition:stroke-dashoffset .3s linear}
#rest.done .ring .prg{stroke:var(--green)}
#rest .rt{font-size:28px;font-weight:700}
#rest button{border-radius:18px;height:36px;padding:0 14px}
/* tab bar */
#tabs button{transition:color .2s}
#tabs button.on svg{animation:tabPop .35s var(--ease)}
@keyframes tabPop{40%{transform:scale(.82)}100%{transform:scale(1)}}
#tabs button.on{font-weight:700}
/* transitions */
main.a-push{animation:pushIn .38s var(--ease)}
main.a-pop{animation:popBack .38s var(--ease)}
main.a-fade>*{animation:fadeUp .45s var(--ease) both}
main.a-fade>*:nth-child(2){animation-delay:.03s}main.a-fade>*:nth-child(3){animation-delay:.06s}main.a-fade>*:nth-child(4){animation-delay:.09s}
main.a-fade>*:nth-child(5){animation-delay:.12s}main.a-fade>*:nth-child(6){animation-delay:.15s}main.a-fade>*:nth-child(n+7){animation-delay:.18s}
@keyframes pushIn{from{transform:translateX(36%);opacity:0}}
@keyframes popBack{from{transform:translateX(-24%);opacity:0}}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}}
.confetti{position:fixed;top:-20px;z-index:60;pointer-events:none;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-color-scheme: dark){.stepper button{background:#3a3a3c;box-shadow:none}.daycard{box-shadow:none}#rest{box-shadow:0 0 0 .5px var(--sep)}}

/* --- v1.3 --- */
#nav.root{border-bottom-color:transparent!important}
#nav.root:not(.line){background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-color-scheme: light){#nav::before{content:"";position:absolute;left:0;right:0;top:0;height:env(safe-area-inset-top);background:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,0));pointer-events:none}}
main>.kicker:first-child{margin-top:14px}
.row .t{line-height:1.3}
.row .s{margin-top:4px;line-height:1.35}
.dayhero{border-radius:22px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;margin:8px 0 6px}
.dayhero .dn{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.85}
.dayhero .dt{font:800 28px/1.15 var(--round);margin-top:4px;letter-spacing:-.4px}
.dayhero .meta{display:flex;gap:18px;margin-top:16px}
.dayhero .meta b{display:block;font:700 22px/1.1 var(--round)}
.dayhero .meta span{font-size:13px;opacity:.85}
.dayhero .big{position:absolute;right:14px;bottom:-30px;font:900 140px/1 var(--round);opacity:.15}
.exrow{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;position:relative}
.exrow+.exrow::before{content:"";position:absolute;top:0;left:74px;right:0;border-top:.5px solid var(--sep)}
.exrow .gi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font:700 15px var(--round);flex:none}
.exrow .grow{flex:1;min-width:0}
.exrow .t{font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.3}
.exrow .g{font-size:14px;color:var(--sec);margin-top:3px}
.exrow .l{font-size:14px;margin-top:8px;color:var(--sec);line-height:1.4}
.exrow .l b{color:var(--text);font-weight:600;font-family:var(--round)}
.exrow .pill{margin-top:8px;display:inline-block}

/* --- v1.4 nuoto --- */
.swgoal{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#30b0c7 0%,#0a84ff 100%);box-shadow:0 10px 26px -12px rgba(10,132,255,.6);margin-top:4px}
.swgoal .dn{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9}
.swgoal .dt{font:800 26px/1.15 var(--round);margin-top:6px;letter-spacing:-.3px}
.swgoal .ds{font-size:15px;opacity:.95;margin-top:8px;line-height:1.4;max-width:88%}
.swgoal .big{position:absolute;right:-6px;bottom:-14px;font-size:86px;opacity:.2}
details.watch{margin-top:14px;padding:0}
details.watch summary{padding:16px 18px;font-weight:600;list-style:none;cursor:pointer;display:flex;justify-content:space-between}
details.watch summary::-webkit-details-marker{display:none}
details.watch summary::after{content:"›";transform:rotate(90deg);color:var(--ter);font-size:22px;line-height:1;transition:transform .2s}
details.watch[open] summary::after{transform:rotate(-90deg)}
details.watch ol{margin:0;padding:0 18px 4px 38px;line-height:1.5;font-size:15px}
details.watch li{margin-bottom:8px}
details.watch .note{padding:0 18px 16px}
.frow>span{color:var(--sec)}
.swset{gap:8px}.swset select{flex:1;background:var(--fill);border:0;border-radius:8px;padding:6px 8px;font-size:16px}
.swset .x{color:var(--ter);padding:4px 6px}
.calc>div{flex:1}

/* --- v1.5 font sport + emoji --- */
@font-face{font-family:"Sport";src:url(fonts/poppins-latin-900-italic.woff2) format("woff2");font-weight:900;font-style:italic;font-display:swap}
@font-face{font-family:"Sport";src:url(fonts/poppins-latin-800-italic.woff2) format("woff2");font-weight:800;font-style:italic;font-display:swap}

:root{--sport:"Sport",var(--round)}
h1.large{font:900 italic 40px/1.05 var(--sport);text-transform:uppercase;letter-spacing:-.5px;margin:2px 0 8px}
.kicker{display:flex;gap:6px;align-items:center}
.daycard .dt,.dayhero .dt,.swgoal .dt,.done-hero h2{font-family:var(--sport);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-.2px}
.daycard .dt{font-size:25px}
.daycard .big,.dayhero .big{font-family:var(--sport);font-style:italic}
.daycard .emo{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.daycard .nx{top:14px}
.daycard.has-nx .emo{top:62%}
.tile .n{font-family:"SportN",var(--round);font-weight:700;letter-spacing:-.5px}
.tile .k .e{font-size:16px;line-height:1}
.sec-h .e{margin-right:4px}
.navtitle{font-weight:700}
.btn{font-weight:800;letter-spacing:.2px}
.hero .lab{font-family:var(--sport);font-style:italic;font-weight:800;letter-spacing:.4px}
.swgoal .dt{font-size:24px}

/* --- v1.6 icone --- */
svg.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.sec-h{display:flex;align-items:center;gap:7px}.sec-h svg.ic{width:16px;height:16px}
.tile .k{gap:8px}
.tic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 2px 6px -2px rgba(0,0,0,.3)}
.tic svg.ic{width:16px;height:16px;stroke-width:2.3}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tbadge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px -8px rgba(0,0,0,.45)}
.tbadge svg.ic{width:26px;height:26px;stroke-width:2.2}
.daycard .emo{width:92px;height:92px;right:10px;font-size:0;opacity:.95;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.daycard .emo svg{width:100%;height:100%}
.dayhero .emo{width:84px;height:84px;right:14px;top:16px;transform:none}.dayhero .big{display:none}.dayhero .dt{max-width:72%}
.dayhero .meta{position:relative;z-index:1}
.swgoal .art{position:absolute;right:-8px;bottom:-6px;width:150px;opacity:.2;pointer-events:none}
.swgoal .dn{display:flex;align-items:center;gap:6px}
.done-hero .art{width:110px;height:110px;margin:0 auto;animation:popIn .6s var(--ease)}
.hint i{display:grid;place-items:center;padding-top:1px}.hint i svg.ic{width:18px;height:18px}
.hint.up i,.hint.up2 i{color:var(--green)}.hint.keep i{color:var(--blue)}.hint.down i{color:var(--orange)}.hint.new i{color:var(--purple)}
.badge.pr svg.ic{width:12px;height:12px;vertical-align:-1px}
#toast svg.ic{vertical-align:-3px}
details.watch summary span{display:flex;align-items:center;gap:8px}

/* --- v1.7 stile filigrana --- */
.daycard .emo{width:150px;height:150px;right:-22px;top:auto;bottom:-34px;transform:rotate(-8deg);opacity:.24;filter:none}
.daycard.has-nx .emo{top:auto}

.dayhero .dt{max-width:none}

.swgoal .ds{max-width:80%}
</style>

<header id="nav"></header>
<main id="main"></main>
<div id="rest" class="hidden">
  <svg class="ring" viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="19"/><circle class="prg" id="restC" cx="22" cy="22" r="19"/></svg><div class="grow"><div class="rl">Recupero</div><div class="rt" id="restT">0:00</div></div>
  <button data-a="restAdd">+15 s</button>
  <button data-a="restSkip">Salta</button>
  <div class="prog" id="restP"></div>
</div>
<nav id="tabs">
  <button data-a="tab" data-t="gym"><svg viewBox="0 0 28 28" fill="currentColor"><rect x="2" y="11" width="3" height="6" rx="1.2"/><rect x="5.5" y="7.5" width="4" height="13" rx="1.6"/><rect x="9.5" y="12.6" width="9" height="2.8" rx="1"/><rect x="18.5" y="7.5" width="4" height="13" rx="1.6"/><rect x="23" y="11" width="3" height="6" rx="1.2"/></svg>Palestra</button>
  <button data-a="tab" data-t="swim"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M3 10c2.5-2.5 5-2.5 7.3 0s4.9 2.5 7.4 0 5-2.5 7.3 0"/><path d="M3 16c2.5-2.5 5-2.5 7.3 0s4.9 2.5 7.4 0 5-2.5 7.3 0"/><path d="M3 22c2.5-2.5 5-2.5 7.3 0s4.9 2.5 7.4 0 5-2.5 7.3 0"/></svg>Nuoto</button>
  <button data-a="tab" data-t="prog"><svg viewBox="0 0 28 28" fill="currentColor"><rect x="4" y="15" width="4.5" height="9" rx="1.5"/><rect x="11.75" y="9" width="4.5" height="15" rx="1.5"/><rect x="19.5" y="4" width="4.5" height="20" rx="1.5"/></svg>Progressi</button>
  <button data-a="tab" data-t="more"><svg viewBox="0 0 28 28" fill="currentColor"><circle cx="6.5" cy="14" r="2.4"/><circle cx="14" cy="14" r="2.4"/><circle cx="21.5" cy="14" r="2.4"/></svg>Altro</button>
</nav>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- Dati di base ---------- */
const EX = {
  panca:      {n:'Panca inclinata multipower', g:'Petto'},
  croci:      {n:'Croci ai cavi alti', g:'Petto'},
  chest:      {n:'Chest press', g:'Petto'},
  rematore:   {n:'Rematore', g:'Schiena'},
  trazioni:   {n:'Trazioni', g:'Schiena', bw:true},
  lat:        {n:'Lat machine', g:'Schiena'},
  frontali:   {n:'Alzate frontali', g:'Spalle'},
  laterali:   {n:'Alzate laterali', g:'Spalle'},
  posteriori: {n:'Alzate laterali basse', g:'Deltoidi posteriori'},
  curl:       {n:'Curl bicipiti', g:'Bicipiti'},
  bicsed:     {n:'Bicipiti seduto', g:'Bicipiti'},
  scott:      {n:'Bicipiti panca Scott', g:'Bicipiti'},
  tric:       {n:'Tricipiti ai cavi', g:'Tricipiti'},
  tricalti:   {n:'Tricipiti cavi alti', g:'Tricipiti'},
  tricbassi:  {n:'Tricipiti cavi bassi', g:'Tricipiti'},
};
const DAYS = {
  1:{name:'Petto e Schiena', color:'var(--blue)', ex:['panca','croci','rematore','trazioni','curl','tric','posteriori']},
  2:{name:'Braccia e Spalle', color:'var(--orange)', ex:['frontali','laterali','bicsed','scott','tricalti','tricbassi','lat','chest']},
  3:{name:'Rotazione', color:'var(--purple)', ex:null},
};
const GCOL = {'Petto':'var(--blue)','Schiena':'var(--teal)','Spalle':'var(--orange)','Deltoidi posteriori':'var(--red)','Bicipiti':'var(--purple)','Tricipiti':'var(--indigo)'};
const GABBR = {'Petto':'Pe','Schiena':'Sc','Spalle':'Sp','Deltoidi posteriori':'Dp','Bicipiti':'Bi','Tricipiti':'Tr'};
const GROUPS = ['Petto','Schiena','Spalle','Deltoidi posteriori','Bicipiti','Tricipiti'];
const STYLES = ['Libero','Misto','Rana','Dorso','Delfino'];
const FEEL = ['Facile','Media','Dura'];

/* ---------- Stato ---------- */
const KEY = 'allenamenti.v1';
let S = load();
function blank(){return {v:1,settings:{rest:120,inc:2.5,repMin:6,repMax:8,weekGoal:3},sessions:[],swims:[],active:null,lastBackup:null}}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.v===1){d.settings=Object.assign(blank().settings,d.settings);return d}}catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Impossibile salvare i dati')}}
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- Utilità ---------- */
const $ = s=>document.querySelector(s);
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN};
const kg = n=>(Math.round(n*100)/100).toLocaleString('it-IT');
const int = n=>Math.round(n).toLocaleString('it-IT');
const exName = id=>(EX[id]||{n:id}).n;
function fmtDur(ms){ms=Math.max(0,ms);const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fmtMin(ms){const m=Math.round(ms/60000);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`}
function fmtDate(ts,long){const d=new Date(ts);return d.toLocaleDateString('it-IT',long?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'})}
function fmtPace(secPer100){if(!isFinite(secPer100)||secPer100<=0)return '–';const m=Math.floor(secPer100/60),s=Math.round(secPer100%60);return `${m}:${String(s).padStart(2,'0')}`}
const isoDay = ts=>{const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dayTs = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12).getTime()};
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
const e1rm = (w,r)=>w*(1+r/30);
const volume = sess=>sess.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
const nSets = sess=>sess.ex.reduce((a,e)=>a+e.sets.length,0);
const chev = '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>';
let toastT;
function toast(msg,ms=2600){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}

/* ---------- Logica allenamento ---------- */
const sessionsDesc = ()=>S.sessions.slice().sort((a,b)=>b.start-a.start);
function day3List(){const n=S.sessions.filter(s=>s.day===3).length;
  return GROUPS.map(g=>{const l=Object.keys(EX).filter(k=>EX[k].g===g);return l[n%l.length]})}
function dayExercises(day){return day===3?day3List():DAYS[day].ex.slice()}
function nextDay(){const l=sessionsDesc()[0];return l?(l.day%3)+1:1}
function history(exId){ // sessioni completate con l'esercizio, dalla più vecchia
  return S.sessions.slice().sort((a,b)=>a.start-b.start).map(s=>{const e=s.ex.find(x=>x.id===exId);return e&&e.sets.length?{s,sets:e.sets}:null}).filter(Boolean)}
function lastSets(exId){const h=history(exId);return h.length?h[h.length-1]:null}
function bestE1(exId,extra){let b=0;history(exId).forEach(h=>h.sets.forEach(x=>b=Math.max(b,e1rm(x.w,x.r))));(extra||[]).forEach(x=>b=Math.max(b,e1rm(x.w,x.r)));return b}
function maxW(exId){let b=0;history(exId).forEach(h=>h.sets.forEach(x=>b=Math.max(b,x.w)));return b}
const setsStr = sets=>sets.map(x=>`${kg(x.w)}×${x.r}`).join(' · ');
function analyze(sets){ // valuta le serie al carico più alto
  const {inc,repMin,repMax}=S.settings;
  const top=Math.max(...sets.map(x=>x.w)); const best=Math.max(...sets.filter(x=>x.w===top).map(x=>x.r));
  return {top,best,inc,repMin,repMax};
}
function suggest(exId){
  const L=lastSets(exId), bw=EX[exId]&&EX[exId].bw;
  const {repMin,repMax}=S.settings;
  if(!L) return {type:'new',icon:ic('sparkle'),text:`Prima volta: scegli un carico con cui arrivi a cedimento tra ${repMin} e ${repMax} ripetizioni.`,next:null};
  const {top,best,inc}=analyze(L.sets);
  const unit = bw&&top===0?' di zavorra':' kg';
  if(best>=repMax+4) return {type:'up2',icon:ic('arrowUp'),text:`Ultima volta ${best} rip: carico troppo leggero. Prova <b>${kg(top+inc*2)}${unit}</b>.`,next:top+inc*2};
  if(best>repMax)    return {type:'up', icon:ic('arrowUp'),text:`Ultima volta ${best} rip, oltre le ${repMax}: è ora di salire a <b>${kg(top+inc)}${unit}</b>.`,next:top+inc};
  if(best>=repMin)   return {type:'keep',icon:ic('target'),text:`Nel range: resta a <b>${kg(top)} kg</b> e punta a ${repMax}+ rip.`,next:top};
  return {type:'down',icon:ic('arrowDown'),text:`Ultima volta solo ${best} rip: valuta <b>${kg(Math.max(0,top-inc))} kg</b>.`,next:Math.max(0,top-inc)};
}
function repBadge(r){const {repMin,repMax}=S.settings;return r>repMax?'<span class="badge hi">↑ carico</span>':r<repMin?'<span class="badge lo">basso</span>':'<span class="badge ok">✓</span>'}

/* ---------- Timer, suono, schermo ---------- */
let actx;
function unlockAudio(){try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)()} if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{unlockAudio();const t=actx.currentTime;[0,.25,.5].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i===2?1175:880;
  g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.22)})}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200])}
let wake=null;
async function keepAwake(){try{if(S.active&&'wakeLock' in navigator&&!wake&&document.visibilityState==='visible'){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();tick()}});
document.addEventListener('touchstart',unlockAudio,{passive:true,once:true});

function tick(){
  const a=S.active;
  document.querySelectorAll('[data-live=total]').forEach(el=>el.textContent=a?fmtDur(Date.now()-a.start):'');
  const rb=$('#rest');
  if(a&&a.restEnd){
    const left=a.restEnd-Date.now();
    rb.classList.remove('hidden');document.body.classList.add('resting');
    if(left<=0){
      rb.classList.add('done');$('#restC').style.strokeDashoffset=0;$('#restT').textContent='Vai!';
      if(!a.restAlerted){a.restAlerted=true;save();beep()}
      if(left<-20000){a.restEnd=null;save()}
    }else{
      rb.classList.remove('done');$('#restT').textContent=fmtDur(left+999);
      $('#restC').style.strokeDashoffset=(119.4*(1-left/(a.restDur||S.settings.rest*1000))).toFixed(1);
    }
  }else{rb.classList.add('hidden');rb.classList.remove('done');document.body.classList.remove('resting')}
}
setInterval(tick,250);
function startRest(){const a=S.active;a.restDur=S.settings.rest*1000;a.restEnd=Date.now()+a.restDur;a.restAlerted=false}

/* ---------- Navigazione ---------- */
let tab='gym', stack=[], progTab='gym';
const cur = ()=>stack.length?stack[stack.length-1]:{v:tab,p:{}};
let anim=null, popSet=null;
function nav(v,p){stack.push({v,p:p||{}});anim='a-push';render(true)}
function back(){stack.pop();anim='a-pop';render(true)}
function render(toTop){
  const c=cur(), view=V[c.v](c.p||{}), y=window.scrollY;
  const left = stack.length?`<button class="navbtn" data-a="back"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>${esc(view.backLabel||'Indietro')}</button>`:'<span></span>';
  const right = view.right?`<button class="navbtn r" data-a="${view.right.a}">${view.right.label}</button>`:'<span></span>';
  $('#nav').innerHTML=stack.length?`<div class="navrow">${left}<div class="navtitle">${esc(view.title)}</div>${right}</div>`:'';$('#nav').classList.toggle('root',!stack.length);
  $('#main').innerHTML=(stack.length?'':`<div class="kicker">${greet()} · ${esc(new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}))}</div><div class="titlerow"><h1 class="large">${esc(view.title)}</h1>${TB[tab]?`<div class="tbadge" style="background:${TB[tab][1]}">${ic(TB[tab][0])}</div>`:''}</div>`)+view.html;
  const M=$('#main');M.classList.remove('a-push','a-pop','a-fade');if(anim){void M.offsetWidth;M.classList.add(anim)}anim=null;popSet=null;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  window.scrollTo(0,toTop?0:y);onScroll();tick();
  if(view.after)view.after();
}
function onScroll(){$('#nav').classList.toggle('line',window.scrollY>4)}
window.addEventListener('scroll',onScroll,{passive:true});

/* ---------- Grafico ---------- */
let gid=0;
function chart(vals,labels,color,fmt){
  if(vals.length<2) return '<div class="empty">Il grafico compare dalla seconda sessione.</div>';
  const W=340,H=150,pl=8,pr=8,pt=18,pb=22,id='g'+(gid++);
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}
  const X=i=>pl+i*(W-pl-pr)/(vals.length-1), Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${X(vals.length-1)} ${H-pb} L${X(0)} ${H-pb} Z`;
  const step=Math.ceil(labels.length/5);
  const lab=labels.map((l,i)=>(i%step===0||i===labels.length-1)?`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${esc(l)}</text>`:'').join('');
  const iMax=vals.indexOf(Math.max(...vals));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join('')}
  <text x="${Math.min(Math.max(pts[iMax][0],20),W-20)}" y="${pts[iMax][1]-7}" text-anchor="middle" style="font-weight:600;fill:${color}">${esc(fmt(vals[iMax]))}</text>${lab}</svg>`;
}
const shortDate = ts=>new Date(ts).toLocaleDateString('it-IT',{day:'numeric',month:'numeric'});

/* ---------- Viste ---------- */
const V = {};

V.gym = ()=>{
  const a=S.active, nd=nextDay(), ws=weekStart(Date.now());
  const week=S.sessions.filter(s=>s.start>=ws), goal=S.settings.weekGoal;
  const wVol=week.reduce((t,s)=>t+volume(s),0);
  const prevW=S.sessions.filter(s=>s.start>=ws-7*864e5&&s.start<ws), pVol=prevW.reduce((t,s)=>t+volume(s),0);
  let h='';
  if(a) h+=`<button class="active-card" data-a="resume"><div><div class="t">Allenamento in corso</div><div class="s">Giorno ${a.day} · ${esc(DAYS[a.day].name)} · tocca per riprendere</div></div><div class="time" data-live="total"></div></button>`;
  h+=`<div class="sec-h">${ic('flag','var(--blue)')}Inizia allenamento</div><div class="days">`;
  [1,2,3].forEach(d=>{
    const ex=dayExercises(d);
    const sub=d===3?ex.map(x=>exName(x)).join(' · '):`${ex.length} esercizi · ${[...new Set(ex.map(x=>EX[x].g))].slice(0,3).join(', ')}`;
    h+=`<button class="daycard d${d}${d===nd&&!a?' has-nx':''}" data-a="day" data-d="${d}"><div class="dn">Giorno ${d}</div><div class="dt">${esc(DAYS[d].name)}</div><div class="ds">${esc(sub)}</div><div class="emo">${DAYART[d]}</div>${d===nd&&!a?'<span class="nx">Prossimo</span>':''}</button>`});
  h+=`</div>`;
  h+=`<div class="sec-h">${ic('calendar','var(--red)')}Questa settimana</div><div class="tiles">
    <div class="tile"><div class="k">${tic('flame','linear-gradient(135deg,#ff9f0a,#ff375f)')}Allenamenti</div><div class="n">${week.length}<small>/ ${goal}</small></div><div class="dots">${Array.from({length:goal},(_,i)=>`<span class="${i<week.length?'on':''}"></span>`).join('')}</div></div>
    <div class="tile"><div class="k">${tic('dumbbell','var(--g-blue)')}Volume</div><div class="n">${int(wVol)}<small>kg</small></div><div class="d">${pVol?`${wVol>=pVol?'<span class="up">▲':'<span class="down">▼'} ${int(Math.abs(wVol-pVol))}</span> vs sett. scorsa`:'peso × ripetizioni'}</div></div></div>`;
  const list=sessionsDesc().slice(0,15);
  h+=`<div class="sec-h">${ic('folder','var(--indigo)')}Storico</div>`;
  h+= list.length?`<div class="list">${list.map(s=>`<button class="row tap" data-a="session" data-id="${s.id}"><div class="grow"><div class="t">${esc(fmtDate(s.start))} · Giorno ${s.day}</div><div class="s">${fmtMin(s.end-s.start)} · ${nSets(s)} serie · ${int(volume(s))} kg${s.prs?` · ${s.prs} record`:''}</div></div>${chev}</button>`).join('')}</div>`
    :`<div class="list"><div class="empty">Nessun allenamento ancora. Scegli un giorno qui sopra e parti!</div></div>`;
  return {title:'Palestra',html:h};
};

V.day = ({d})=>{
  d=+d; const ex=dayExercises(d);
  const lastDay=sessionsDesc().find(s=>s.day===d);
  let h=`<div class="dayhero daycard d${d}" style="min-height:0"><div class="dn">Giorno ${d}</div><div class="emo">${DAYART[d]}</div><div class="dt">${esc(DAYS[d].name)}</div>
    <div class="meta"><div><b>${ex.length}</b><span>esercizi</span></div><div><b>~${ex.length*3*(S.settings.rest/60+0.75)|0}′</b><span>durata stimata</span></div><div><b>${lastDay?esc(shortDate(lastDay.start)):'–'}</b><span>ultima volta</span></div></div><div class="big">${d}</div></div>`;
  h+=`<div class="sec-h">${ic('list','var(--blue)')}Esercizi</div><div class="list">${ex.map(id=>{const L=lastSets(id),sg=suggest(id),g=EX[id].g,gc=GCOL[g]||'var(--sec)';
    return `<div class="exrow"><div class="gi" style="background:color-mix(in srgb,${gc} 16%,transparent);color:${gc}">${GABBR[g]||'•'}</div><div class="grow"><div class="t">${esc(exName(id))}</div><div class="g">${esc(g)}</div>${L?`<div class="l">Ultima volta: <b>${setsStr(L.sets)}</b></div>`:''}${sg.type==='up'||sg.type==='up2'?`<span class="pill green">↑ Prova ${kg(sg.next)} kg</span>`:''}</div></div>`}).join('')}</div>`;
  if(d===3) h+=`<div class="sec-f">Un esercizio per gruppo muscolare, preso dai giorni 1 e 2. Cambia a ogni giorno 3 che completi.</div>`;
  h+=`<button class="btn primary" data-a="start" data-d="${d}" style="margin-top:20px">Inizia allenamento</button>`;
  return {title:`Giorno ${d} · ${DAYS[d].name}`,html:h,backLabel:'Palestra'};
};

function exCard(e,idx){
  const id=e.id, inc=S.settings.inc, sg=suggest(id), L=lastSets(id);
  const lastSet=e.sets[e.sets.length-1];
  const w = e.nextW!=null?e.nextW : lastSet?lastSet.w : (sg.next!=null?sg.next:'');
  const r = lastSet?lastSet.r : S.settings.repMax;
  const g=(EX[id]||{}).g||'', gc=GCOL[g]||'var(--sec)';
  let h=`<div class="card ex${e.sets.length>=3?' done':''}" id="ex_${id}"><div class="head"><div class="gi" style="background:color-mix(in srgb,${gc} 16%,transparent);color:${gc}">${GABBR[g]||'•'}</div><div class="grow"><div class="name">${esc(exName(id))}</div><div class="grp">${esc(g)}${EX[id]&&EX[id].bw?' · peso = zavorra':''}</div></div><span class="cnt">${e.sets.length>=3?'✓ ':''}${e.sets.length} serie</span></div>`;
  if(L) h+=`<div class="last">Ultima volta (${esc(shortDate(L.s.start))}): <b>${setsStr(L.sets)}</b></div>`;
  h+=`<div class="hint ${sg.type}"><i>${sg.icon}</i><span>${sg.text}</span></div>`;
  if(e.sets.length) h+=`<div class="sets">${e.sets.map((s,i)=>`<div class="set${popSet&&popSet[0]===idx&&popSet[1]===i?' pop':''}"><span class="no">${i+1}</span><span class="val">${kg(s.w)} kg × ${s.r}</span>${s.pr?'<span class="badge pr">'+ic('trophy')+' record</span>':''}${repBadge(s.r)}<button class="x" data-a="delSet" data-i="${idx}" data-s="${i}" aria-label="Elimina serie">✕</button></div>`).join('')}</div>`;
  h+=`<div class="entry">
    <div class="stepper"><button data-a="step" data-t="w_${idx}" data-d="-${inc}">−</button><input id="w_${idx}" inputmode="decimal" value="${w===''?'':kg(w)}" placeholder="kg"><button data-a="step" data-t="w_${idx}" data-d="${inc}">+</button></div>
    <div class="stepper"><button data-a="step" data-t="r_${idx}" data-d="-1">−</button><input id="r_${idx}" inputmode="numeric" value="${r}" placeholder="rip"><button data-a="step" data-t="r_${idx}" data-d="1">+</button></div>
    <button class="addset" data-a="addSet" data-i="${idx}" aria-label="Aggiungi serie"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
    <div class="unitlab"><span>kg</span><span>ripetizioni</span><i></i></div></div>`;
  return h;
}

V.workout = ()=>{
  const a=S.active; if(!a){stack=[];return V.gym()}
  const doneEx=a.ex.filter(e=>e.sets.length).length;
  let h=`<div class="hero grad"><div><div class="lab">Tempo totale</div><div class="time" data-live="total"></div></div><div class="sub"><b>${doneEx}/${a.ex.length}</b>esercizi · ${nSets(a)} serie<div class="bar"><i style="width:${a.ex.length?100*doneEx/a.ex.length:0}%"></i></div></div></div>`;
  h+=a.ex.map((e,i)=>exCard(e,i)).join('');
  h+=`<button class="btn plain" data-a="pick">＋ Aggiungi esercizio</button>
      <button class="btn green" data-a="finish" style="margin-top:22px">Termina allenamento</button>
      <button class="btn danger" data-a="discard">Annulla allenamento</button>`;
  return {title:`Giorno ${a.day} · ${DAYS[a.day].name}`,html:h,right:{a:'finish',label:'Fine'},backLabel:'Palestra'};
};

V.pick = ()=>{
  const have=new Set(S.active?S.active.ex.map(e=>e.id):[]);
  let h='';
  GROUPS.forEach(g=>{h+=`<div class="sec-h">${esc(g)}</div><div class="list">`+Object.keys(EX).filter(k=>EX[k].g===g).map(k=>`<button class="row tap" data-a="addEx" data-id="${k}"><div class="grow t">${esc(EX[k].n)}</div>${have.has(k)?'<span class="pill">già presente</span>':chev}</button>`).join('')+`</div>`});
  return {title:'Aggiungi esercizio',html:h};
};

V.session = ({id,done})=>{
  const s=S.sessions.find(x=>x.id===id); if(!s){stack=[];return V.gym()}
  let h='';
  if(done){
    const ups=s.ex.filter(e=>e.sets.length&&(()=>{const t=suggest(e.id).type;return t==='up'||t==='up2'})());
    h+=`<div class="done-hero"><div class="art">${TROPHYART}</div><h2>Ottimo lavoro!</h2><p>${esc(fmtDate(s.start,true))}</p></div>`;
    if(s.prs) h+=`<div class="hint up" style="margin-bottom:12px"><i>${ic('trophy')}</i><span>${s.prs===1?'Hai battuto 1 record personale!':`Hai battuto ${s.prs} record personali!`}</span></div>`;
    if(ups.length) h+=`<div class="hint up2" style="margin-bottom:12px"><i>${ic('arrowUp')}</i><span>La prossima volta aumenta il carico su: <b>${ups.map(e=>esc(exName(e.id))).join(', ')}</b>.</span></div>`;
  }
  h+=`<div class="tiles"><div class="tile"><div class="k">${tic('timer','var(--g-d3)')}Durata</div><div class="n">${Math.round((s.end-s.start)/60000)}<small>min</small></div></div><div class="tile"><div class="k">${tic('dumbbell','var(--g-blue)')}Volume</div><div class="n">${int(volume(s))}<small>kg</small></div><div class="d">${nSets(s)} serie</div></div></div>`;
  s.ex.filter(e=>e.sets.length).forEach(e=>{
    h+=`<div class="sec-h">${esc(exName(e.id))}</div><div class="list">${e.sets.map((x,i)=>`<div class="row"><span class="set" style="border:0;padding:0;flex:1"><span class="no">${i+1}</span><span class="val">${kg(x.w)} kg × ${x.r}</span>${x.pr?'<span class="badge pr">'+ic('trophy')+'</span>':''}${repBadge(x.r)}</span></div>`).join('')}</div>`});
  h+= done?`<button class="btn primary" data-a="tab" data-t="gym" style="margin-top:24px">Fatto</button>`
          :`<button class="btn danger" data-a="delSession" data-id="${s.id}" style="margin-top:24px">Elimina allenamento</button>`;
  return {title:done?'Riepilogo':fmtDate(s.start),html:h,backLabel:'Palestra'};
};

/* --- Nuoto --- */
const swimsDesc = ()=>S.swims.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
const swDist = w=>w.laps*w.pool;
const swPace = w=>w.sec>0&&swDist(w)>0?w.sec/(swDist(w)/100):NaN;
function swGoal(list){
  const l=list[0];
  if(!l) return {t:'Prima nuotata',d:'Parti con <b>20 vasche (500 m)</b>, fermandoti a bordo vasca quando serve. L’importante è finire senza fretta.'};
  const step=l.feel===0?4:l.feel===1?2:0, laps=l.laps+step;
  if(step) return {t:`${laps} vasche · ${int(laps*l.pool)} m`,d:`L’ultima volta ${l.laps} vasche (${FEEL[l.feel].toLowerCase()}). Aggiungi ${step} vasche${isFinite(swPace(l))?` e prova a stare sotto ${fmtPace(swPace(l))}/100 m`:''}.`};
  return {t:`${l.laps} vasche · ${int(swDist(l))} m`,d:`L’ultima volta è stata dura: ripeti la stessa distanza${isFinite(swPace(l))?` e prova a scendere sotto ${fmtPace(swPace(l))}/100 m`:''}.`};
}
V.swim = ()=>{
  const list=swimsDesc(), now=new Date(), ms=new Date(now.getFullYear(),now.getMonth(),1).getTime(), ws=weekStart(Date.now());
  const month=list.filter(w=>dayTs(w.date)>=ms), week=list.filter(w=>dayTs(w.date)>=ws);
  const last4=list.slice(0,4).filter(w=>isFinite(swPace(w)));
  const avgPace=last4.length?last4.reduce((t,w)=>t+w.sec,0)/last4.reduce((t,w)=>t+swDist(w)/100,0):NaN;
  const best=list.reduce((b,w)=>isFinite(swPace(w))&&(!b||swPace(w)<swPace(b))?w:b,null);
  const g=swGoal(list);
  let h=`<div class="swgoal"><div class="dn">${ic('target')} Obiettivo prossima volta</div><div class="dt">${g.t}</div><div class="ds">${g.d}</div><div class="art">${SWIMART}</div></div>`;
  h+=`<button class="btn primary" data-a="swimNew">＋ Registra sessione</button>`;
  h+=`<details class="card watch"${list.length?'':' open'}><summary><span>${ic('watch','var(--blue)')} Come cronometrare con Apple Watch</span></summary><ol>
    <li>Sul Watch apri <b>Allenamento</b> → <b>Nuoto in piscina</b>.</li>
    <li>Tocca i tre puntini e imposta la <b>lunghezza vasca a 25 m</b>, poi avvia. Lo schermo si blocca da solo in acqua.</li>
    <li>Per le pause fermati a bordo vasca: il Watch le riconosce da solo.</li>
    <li>Alla fine sblocca il Watch con la <b>Digital Crown</b> (tienila premuta, o ruotala sui modelli più vecchi), scorri a destra e tocca <b>Termina</b>.</li>
    <li>Qui tocca <b>Registra sessione</b> e copia <b>Distanza</b> e <b>Durata</b> dal riepilogo del Watch (o dall’app Fitness sull’iPhone).</li></ol>
    <div class="note">L’app non può leggere direttamente i dati del Watch: è una limitazione di iPhone per le app web. Bastano 20 secondi per copiarli.</div></details>`;
  h+=`<div class="sec-h">${ic('chart','var(--green)')}Riepilogo</div><div class="tiles">
    <div class="tile"><div class="k">${tic('swimmer','linear-gradient(135deg,#30b0c7,#0a84ff)')}Settimana</div><div class="n">${week.reduce((t,w)=>t+w.laps,0)}<small>vasche</small></div><div class="d">${int(week.reduce((t,w)=>t+swDist(w),0))} m</div></div>
    <div class="tile"><div class="k">${tic('calendar','linear-gradient(135deg,#ff6961,#ff375f)')}Questo mese</div><div class="n">${int(month.reduce((t,w)=>t+swDist(w),0))}<small>m</small></div><div class="d">${month.length} session${month.length===1?'e':'i'}</div></div>
    <div class="tile"><div class="k">${tic('timer','var(--g-d3)')}Passo medio</div><div class="n">${fmtPace(avgPace)}<small>/100 m</small></div><div class="d">ultime ${last4.length||0} sessioni</div></div>
    <div class="tile"><div class="k">${tic('trophy','linear-gradient(135deg,#ffd60a,#ff9f0a)')}Miglior passo</div><div class="n">${best?fmtPace(swPace(best)):'–'}<small>/100 m</small></div><div class="d">${best?esc(fmtDate(dayTs(best.date))):'—'}</div></div></div>`;
  h+=`<div class="sec-h">${ic('folder','var(--indigo)')}Storico</div>`;
  h+= list.length?`<div class="list">${list.map(w=>`<button class="row tap" data-a="swimEdit" data-id="${w.id}"><div class="grow"><div class="t">${esc(fmtDate(dayTs(w.date)))} · ${int(swDist(w))} m</div><div class="s">${w.laps} vasche · ${w.sec?fmtDur(w.sec*1000):'–'} · ${fmtPace(swPace(w))}/100 m${w.kcal?` · ${w.kcal} kcal`:''}</div>${w.sets&&w.sets.length?`<div class="s">${w.sets.map(x=>`${x.n}×${x.d} ${esc(x.style.toLowerCase())}`).join(' · ')}</div>`:''}</div>${chev}</button>`).join('')}</div>`
    :`<div class="list"><div class="empty">Nessuna sessione registrata. Dopo la piscina tocca “Registra sessione”.</div></div>`;
  return {title:'Nuoto',html:h};
};
function swSetRow(x){return `<div class="frow swset"><input class="num" inputmode="numeric" value="${x.n||''}" placeholder="4" style="width:52px"><span>×</span><input class="num" inputmode="numeric" value="${x.d||''}" placeholder="50" style="width:64px"><span>m</span><select>${STYLES.map(s=>`<option ${s===(x.style||'Libero')?'selected':''}>${s}</option>`).join('')}</select><button class="x" data-a="swSetDel" aria-label="Elimina">✕</button></div>`}
V.swimForm = ({id})=>{
  const w=id?S.swims.find(x=>x.id===id):null, prev=swimsDesc().find(x=>x.id!==id);
  const d=w||{date:isoDay(Date.now()),pool:prev?prev.pool:25,laps:prev?prev.laps:20,sec:0,style:prev?prev.style:'Libero',feel:1,notes:'',kcal:'',hr:'',sets:[]};

  const stp=(id,step,val,w2)=>`<div class="stepper" style="flex:none;width:${w2||160}px;height:44px"><button data-a="step" data-t="${id}" data-d="-${step}">−</button><input id="${id}" inputmode="numeric" value="${val}"><button data-a="step" data-t="${id}" data-d="${step}">+</button></div>`;
  let h=`${w?'':`<div class="hint new" style="margin:4px 0 14px"><i>${ic('watch')}</i><span>Copia <b>Distanza</b> e <b>Durata</b> dal riepilogo dell’allenamento sul Watch. Le vasche si calcolano da sole.</span></div>`}
  <div class="list">
    <div class="frow"><label>Data</label><input type="date" id="sw_date" value="${d.date}"></div>
    <div class="frow"><label>Vasca</label><div class="seg" id="sw_pool">${[25,50].map(p=>`<button data-a="swPool" data-v="${p}" class="${d.pool===p?'on':''}">${p} m</button>`).join('')}</div></div>
    <div class="frow"><label>Distanza (m)</label>${stp('sw_m',d.pool,d.laps*d.pool)}</div>
    <div class="frow"><label>Vasche</label>${stp('sw_laps',1,d.laps)}</div>
    <div class="frow"><label>Durata</label><input class="num" id="sw_min" inputmode="numeric" placeholder="min" value="${d.sec?Math.floor(d.sec/60):''}"><span>:</span><input class="num" id="sw_sec" inputmode="numeric" placeholder="sec" value="${d.sec?String(d.sec%60).padStart(2,'0'):''}" style="width:64px"></div>
  </div>
  <div class="list" style="margin-top:12px"><div class="calc" id="sw_calc"></div></div>
  <div class="sec-h">Come è andata</div><div class="list">
    <div class="frow"><label>Stile principale</label><select id="sw_style">${STYLES.map(s=>`<option ${s===d.style?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="frow"><label>Fatica</label><div class="seg" id="sw_feel">${FEEL.map((f,i)=>`<button data-a="swFeel" data-v="${i}" class="${d.feel===i?'on':''}">${f}</button>`).join('')}</div></div>
  </div>
  <div class="sec-h">Dal Watch · facoltativo</div><div class="list">
    <div class="frow"><label>Calorie attive</label><input class="num" id="sw_kcal" inputmode="numeric" placeholder="kcal" value="${d.kcal||''}" style="width:90px"></div>
    <div class="frow"><label>Frequenza cardiaca media</label><input class="num" id="sw_hr" inputmode="numeric" placeholder="bpm" value="${d.hr||''}" style="width:90px"></div>
  </div>
  <div class="sec-h">Serie · facoltativo</div><div class="list" id="sw_sets">${(d.sets||[]).map(swSetRow).join('')}<button class="row tap" data-a="swSetAdd"><div class="grow t" style="color:var(--blue)">＋ Aggiungi serie (es. 4 × 50 m)</div></button></div>
  <div class="sec-h">Note</div><div class="list"><textarea id="sw_notes" placeholder="Es. recupero 30 s tra le vasche, gambe stanche…">${esc(d.notes)}</textarea></div>
  <button class="btn primary" data-a="swimSave" data-id="${id||''}" style="margin-top:20px">Salva</button>
  ${id?`<button class="btn danger" data-a="swimDel" data-id="${id}">Elimina sessione</button>`:''}`;
  return {title:id?'Modifica sessione':'Nuova sessione',html:h,backLabel:'Nuoto',right:{a:'swimSave',label:'Salva'},after:swCalc};
};
function swRead(){const m=num($('#sw_min').value)||0,s=num($('#sw_sec').value)||0,n=id=>{const v=Math.round(num($(id).value));return v>0?v:null};
  const sets=[...document.querySelectorAll('#sw_sets .swset')].map(r=>{const i=r.querySelectorAll('input');return {n:Math.round(num(i[0].value))||0,d:Math.round(num(i[1].value))||0,style:r.querySelector('select').value}}).filter(x=>x.n>0&&x.d>0);
  return {date:$('#sw_date').value||isoDay(Date.now()),pool:window._pool,laps:Math.max(0,Math.round(num($('#sw_laps').value)||0)),sec:Math.round(m*60+s),style:$('#sw_style').value,feel:window._feel,notes:$('#sw_notes').value.trim(),kcal:n('#sw_kcal'),hr:n('#sw_hr'),sets}}
function swCalc(){const el=$('#sw_calc');if(!el)return;const w=swRead(),c=cur(),prev=swimsDesc().find(x=>x.id!==c.p.id&&x.date<=w.date);
  let cmp='';if(prev){const dd=swDist(w)-swDist(prev);cmp=dd?`<div class="k ${dd>0?'up':'down'}">${dd>0?'+':''}${int(dd)} m vs ultima</div>`:'<div class="k">= ultima volta</div>'}
  const st=w.sets.reduce((t,x)=>t+x.n*x.d,0);
  el.innerHTML=`<div><div class="n">${int(swDist(w))} m</div><div class="k">${w.laps} vasche</div>${cmp}</div><div><div class="n">${fmtPace(swPace(w))}</div><div class="k">Passo /100 m</div>${prev&&isFinite(swPace(prev))&&isFinite(swPace(w))?`<div class="k ${swPace(w)<=swPace(prev)?'up':'down'}">${swPace(w)<=swPace(prev)?'più veloce':'più lento'} di ${Math.abs(Math.round(swPace(w)-swPace(prev)))} s</div>`:''}</div>${st?`<div><div class="n">${int(st)} m</div><div class="k">nelle serie</div></div>`:''}`}

/* --- Progressi --- */
V.prog = ()=>{
  let h=`<div class="seg" style="margin-bottom:6px"><button data-a="progTab" data-v="gym" class="${progTab==='gym'?'on':''}">Palestra</button><button data-a="progTab" data-v="swim" class="${progTab==='swim'?'on':''}">Nuoto</button></div>`;
  if(progTab==='gym'){
    const ss=S.sessions.slice().sort((a,b)=>a.start-b.start), m30=Date.now()-30*864e5, r30=ss.filter(s=>s.start>=m30);
    const totPR=ss.reduce((t,s)=>t+(s.prs||0),0);
    h+=`<div class="sec-h">Ultimi 30 giorni</div><div class="tiles"><div class="tile"><div class="k">${tic('flame','linear-gradient(135deg,#ff9f0a,#ff375f)')}Allenamenti</div><div class="n">${r30.length}</div><div class="d">${ss.length} in totale</div></div><div class="tile"><div class="k">${tic('trophy','linear-gradient(135deg,#ffd60a,#ff9f0a)')}Record battuti</div><div class="n">${r30.reduce((t,s)=>t+(s.prs||0),0)}</div><div class="d">${totPR} in totale</div></div></div>`;
    // volume per settimana (ultime 8)
    const ws=weekStart(Date.now()), weeks=[];for(let i=7;i>=0;i--){const st=ws-i*7*864e5;weeks.push({st,v:ss.filter(s=>s.start>=st&&s.start<st+7*864e5).reduce((t,s)=>t+volume(s),0)})}
    if(ss.length) h+=`<div class="sec-h">Volume settimanale (kg)</div><div class="card">${chart(weeks.map(w=>w.v),weeks.map(w=>shortDate(w.st)),'var(--blue)',v=>int(v))}</div>`;
    const ids=Object.keys(EX).filter(k=>history(k).length).concat([...new Set(ss.flatMap(s=>s.ex.map(e=>e.id)))].filter(k=>!EX[k]&&history(k).length));
    const ups=ids.filter(k=>['up','up2'].includes(suggest(k).type));
    if(ups.length) h+=`<div class="sec-h">${ic('arrowUp','var(--green)')}Pronti per aumentare il carico</div><div class="list">${ups.map(k=>{const sg=suggest(k);return `<button class="row tap" data-a="exDetail" data-id="${k}"><div class="grow"><div class="t">${esc(exName(k))}</div><div class="s">Prossima volta: ${kg(sg.next)} kg</div></div><span class="pill green">+${kg(sg.next-analyze(lastSets(k).sets).top)} kg</span>${chev}</button>`}).join('')}</div>`;
    h+=`<div class="sec-h">${ic('list','var(--blue)')}Esercizi</div>`;
    h+= ids.length?`<div class="list">${ids.map(k=>{const H=history(k),l=analyze(H[H.length-1].sets),f=analyze(H[0].sets),d=l.top-f.top;
      return `<button class="row tap" data-a="exDetail" data-id="${k}"><div class="grow"><div class="t">${esc(exName(k))}</div><div class="s">${H.length} session${H.length===1?"e":"i"} · record ${kg(maxW(k))} kg</div></div><span class="v">${kg(l.top)} kg</span>${d?`<span class="pill ${d>0?'green':'red'}">${d>0?'+':''}${kg(d)}</span>`:''}${chev}</button>`}).join('')}</div>`
      :`<div class="list"><div class="empty">Completa il primo allenamento per vedere i progressi.</div></div>`;
  }else{
    const sw=S.swims.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-16);
    const tot=S.swims.reduce((t,w)=>t+swDist(w),0);
    h+=`<div class="sec-h">Totale</div><div class="tiles"><div class="tile"><div class="k">${tic('wave','linear-gradient(135deg,#40c8e0,#0a84ff)')}Distanza</div><div class="n">${tot>=10000?kg(Math.round(tot/100)/10)+'<small>km</small>':int(tot)+'<small>m</small>'}</div></div><div class="tile"><div class="k">${tic('swimmer','linear-gradient(135deg,#30b0c7,#0a84ff)')}Sessioni</div><div class="n">${S.swims.length}</div></div></div>`;
    h+=`<div class="sec-h">Distanza per sessione (m)</div><div class="card">${chart(sw.map(swDist),sw.map(w=>shortDate(dayTs(w.date))),'var(--teal)',v=>int(v))}</div>`;
    const sp=sw.filter(w=>isFinite(swPace(w)));
    h+=`<div class="sec-h">Passo /100 m (più basso = più veloce)</div><div class="card">${chart(sp.map(w=>-swPace(w)),sp.map(w=>shortDate(dayTs(w.date))),'var(--green)',v=>fmtPace(-v))}</div>`;
  }
  return {title:'Progressi',html:h};
};
V.exDetail = ({id})=>{
  const H=history(id); if(!H.length){stack.pop();return V.prog()}
  const tops=H.map(x=>analyze(x.sets).top), e1=H.map(x=>Math.max(...x.sets.map(s=>e1rm(s.w,s.r)))), sg=suggest(id);
  let h=`<div class="hint ${sg.type}" style="margin:0 0 12px"><i>${sg.icon}</i><span>${sg.text}</span></div>`;
  h+=`<div class="tiles"><div class="tile"><div class="k">${tic('trophy','linear-gradient(135deg,#ffd60a,#ff9f0a)')}Carico record</div><div class="n">${kg(maxW(id))}<small>kg</small></div></div><div class="tile"><div class="k">${tic('bolt','linear-gradient(135deg,#ff453a,#ff9f0a)')}Massimale stimato</div><div class="n">${kg(Math.round(Math.max(...e1)*2)/2)}<small>kg</small></div><div class="d">1RM (formula Epley)</div></div></div>`;
  h+=`<div class="sec-h">Carico di lavoro (kg)</div><div class="card">${chart(tops,H.map(x=>shortDate(x.s.start)),'var(--blue)',v=>kg(v))}</div>`;
  h+=`<div class="sec-h">${ic('folder','var(--indigo)')}Storico</div><div class="list">${H.slice().reverse().map(x=>`<div class="row"><div class="grow"><div class="t">${esc(fmtDate(x.s.start))}</div><div class="s">${setsStr(x.sets)}</div></div></div>`).join('')}</div>`;
  return {title:exName(id),html:h,backLabel:'Progressi'};
};

  h+=`<button class="btn danger" data-a="reset" style="margin-top:24px">Cancella tutti i dati</button><div class="sec-f" style="text-align:center;margin-bottom:10px">Allenamenti · versione 1.7</div>`;

/* ---------- Azioni ---------- */
const A = {
  tab:d=>{tab=d.t;stack=[];anim='a-fade';render(true)},
  back:()=>back(),
  day:d=>nav('day',{d:+d.d}),
  resume:()=>nav('workout'),
  start:d=>{
    if(S.active&&!confirm('C’è già un allenamento in corso. Vuoi annullarlo e iniziarne uno nuovo?'))return;
    unlockAudio();
    S.active={id:uid(),day:+d.d,start:Date.now(),ex:dayExercises(+d.d).map(id=>({id,sets:[]})),restEnd:null};
    save();keepAwake();stack=[{v:'workout',p:{}}];tab='gym';render(true);
  },
  step:d=>{const el=document.getElementById(d.t);let v=num(el.value);if(isNaN(v))v=0;v=Math.max(0,Math.round((v+num(d.d))*100)/100);el.value=d.t.startsWith('w_')?kg(v):v;el.dispatchEvent(new Event('input',{bubbles:true}))},
  addSet:d=>{
    const a=S.active,i=+d.i,e=a.ex[i],w=num($('#w_'+i).value),r=Math.round(num($('#r_'+i).value));
    if(isNaN(w)||w<0){toast('Inserisci il peso');return} if(!(r>0)){toast('Inserisci le ripetizioni');return}
    const prev=bestE1(e.id,e.sets), set={w,r,t:Date.now()};
    const hadHistory=history(e.id).length||e.sets.length;
    if(hadHistory&&e1rm(w,r)>prev+0.01&&w>0){set.pr=true}
    e.sets.push(set);e.nextW=null;popSet=[i,e.sets.length-1];
    const {repMax,inc}=S.settings;
    let msg='';
    if(set.pr) msg=ic('trophy','#ffd60a')+' Nuovo record personale!';
    if(r>=repMax+4){e.nextW=w+inc*2;msg=(msg?msg+'<br>':'')+`${r} rip: troppo leggero, prova ${kg(w+inc*2)} kg`}
    else if(r>repMax){e.nextW=w+inc;msg=(msg?msg+'<br>':'')+`${r} rip: alza a ${kg(w+inc)} kg`}
    startRest();save();render();if(msg)toast(msg,3200);
  },
  delSet:d=>{const e=S.active.ex[+d.i];e.sets.splice(+d.s,1);e.nextW=null;save();render()},
  restAdd:()=>{const a=S.active;if(!a)return;const base=Math.max(a.restEnd,Date.now());a.restEnd=base+15000;a.restDur=(a.restDur||0)+15000;a.restAlerted=false;save();tick()},
  restSkip:()=>{if(S.active){S.active.restEnd=null;save();tick()}},
  pick:()=>nav('pick'),
  addEx:d=>{const a=S.active;if(!a)return;if(a.ex.some(e=>e.id===d.id)){toast('Esercizio già presente');return}a.ex.push({id:d.id,sets:[]});save();stack.pop();render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50)},
  finish:()=>{
    const a=S.active;if(!a)return;
    if(!nSets(a)){if(confirm('Nessuna serie registrata. Vuoi annullare l’allenamento?')){S.active=null;save();releaseWake();stack=[];render(true)}return}
    if(!confirm('Terminare l’allenamento?'))return;
    const s={id:a.id,day:a.day,start:a.start,end:Date.now(),ex:a.ex.filter(e=>e.sets.length).map(e=>({id:e.id,sets:e.sets}))};
    s.prs=s.ex.reduce((t,e)=>t+e.sets.filter(x=>x.pr).length,0);
    S.sessions.push(s);S.active=null;save();releaseWake();tab='gym';stack=[{v:'session',p:{id:s.id,done:true}}];anim='a-fade';render(true);confetti();
  },
  discard:()=>{if(confirm('Annullare l’allenamento? Le serie registrate andranno perse.')){S.active=null;save();releaseWake();stack=[];render(true)}},
  session:d=>nav('session',{id:d.id}),
  delSession:d=>{if(confirm('Eliminare questo allenamento?')){S.sessions=S.sessions.filter(s=>s.id!==d.id);save();back()}},
  swimNew:()=>nav('swimForm',{}),
  swimEdit:d=>nav('swimForm',{id:d.id}),
  swPool:d=>{window._pool=+d.v;const m=$('#sw_m');m.value=(Math.round(num($('#sw_laps').value))||0)*window._pool;m.previousElementSibling.dataset.d='-'+d.v;m.nextElementSibling.dataset.d=d.v;document.querySelectorAll('#sw_pool button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));swCalc()},
  swFeel:d=>{window._feel=+d.v;document.querySelectorAll('#sw_feel button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v))},
  swimSave:()=>{
    const id=cur().p.id, w=swRead(); if(!w.laps){toast('Inserisci il numero di vasche');return}
    if(id){Object.assign(S.swims.find(x=>x.id===id),w)}else{S.swims.push(Object.assign({id:uid(),created:Date.now()},w))}
    const best=S.swims.filter(x=>x.id!==id).reduce((b,x)=>Math.max(b,swDist(x)),0);
    save();back();toast(!id&&best&&swDist(w)>best?ic('trophy','#ffd60a')+' La tua nuotata più lunga!':'Sessione salvata ✓');
  },
  swSetAdd:()=>{const b=document.querySelector('#sw_sets [data-a=swSetAdd]');const last=[...document.querySelectorAll('#sw_sets .swset')].pop();b.insertAdjacentHTML('beforebegin',swSetRow(last?{n:last.querySelectorAll('input')[0].value,d:last.querySelectorAll('input')[1].value,style:last.querySelector('select').value}:{n:4,d:50}));swCalc()},
  swSetDel:(d,el)=>{el.closest('.swset').remove();swCalc()},
  swimDel:d=>{if(confirm('Eliminare questa sessione?')){S.swims=S.swims.filter(x=>x.id!==d.id);save();back()}},
  progTab:d=>{progTab=d.v;render()},
  exDetail:d=>nav('exDetail',{id:d.id}),
  setOpt:d=>{const st=S.settings;
    if(d.k==='range'){const [a,b]=d.v.split('-').map(Number);st.repMin=a;st.repMax=b}else st[d.k]=num(d.v);save();render()},
  export:async()=>{
    const data=JSON.stringify(Object.assign({},S,{exportedAt:new Date().toISOString()}),null,1);
    const name=`allenamenti-backup-${isoDay(Date.now())}.json`;
    const file=new File([data],name,{type:'application/json'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup allenamenti'})}
      else{const u=URL.createObjectURL(file),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
      S.lastBackup=Date.now();save();render();toast('Backup creato ✓');
    }catch(e){if(e.name!=='AbortError')toast('Esportazione non riuscita')}
  },
  import:()=>$('#importFile').click(),
  reset:()=>{if(confirm('Cancellare TUTTI i dati? Consiglio di esportare prima un backup.')&&confirm('Sicuro? L’operazione non si può annullare.')){S=blank();save();releaseWake();stack=[];render(true);toast('Dati cancellati')}},
};
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.v!==1||!Array.isArray(d.sessions)||!Array.isArray(d.swims))throw 0;
    if(!confirm(`Importare il backup? Contiene ${d.sessions.length} allenamenti e ${d.swims.length} nuotate. I dati attuali verranno sostituiti.`))return;
    delete d.exportedAt;d.settings=Object.assign(blank().settings,d.settings);S=d;save();stack=[];render(true);toast('Backup importato ✓')}
    catch(err){toast('File non valido')} e.target.value=''};
  rd.readAsText(f);
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();const f=A[el.dataset.a];if(f)f(el.dataset,el)});
document.addEventListener('input',e=>{if(!$('#sw_calc')||!e.target.closest('#main'))return;

  if(e.target.id==='sw_m'){$('#sw_laps').value=Math.round((num(e.target.value)||0)/pool)}
  if(e.target.id==='sw_laps'){$('#sw_m').value=(Math.round(num(e.target.value))||0)*pool}
  swCalc()});
document.addEventListener('change',e=>{if(e.target.id==='sw_m'){const v=(Math.round(num($('#sw_laps').value))||0)*(window._pool||25);e.target.value=v}});
document.addEventListener('focusin',e=>{if(e.target.matches('.stepper input'))setTimeout(()=>e.target.select(),0)});

function confetti(){const cols=['#0a84ff','#30d158','#ff9f0a','#ff375f','#bf5af2','#ffd60a'];
  for(let k=0;k<70;k++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[k%cols.length];
    c.style.setProperty('--dx',(Math.random()*120-60)+'px');c.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
